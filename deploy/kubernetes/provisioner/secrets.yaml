# PLACEHOLDERS, no values. This is a public repository: never put a value here.
# Fill each one in your own way (kubectl create secret, SOPS in your gitops
# repo, ...), outside this directory. manifests_test.go fails if a Secret here
# carries data or stringData.
#
# The Tailscale auth key, for the pod's first start only (a tagged, reusable-
# or one-off key). Key: authkey. The deployment reads it as optional, so the
# pod also starts once the node has joined and the key is gone.
apiVersion: v1
kind: Secret
metadata:
  name: comebye-provisioner-tailscale-auth
  namespace: comebye-hub   # CHANGE-ME
type: Opaque
---
# The Tailscale OAuth client the worker tool uses to mint a key for a NEW
# worker (create only; wake, stop and start need none). Key: tailscale-oauth,
# the file's contents as `ts_oauth_file` expects them (see docs/workers.md).
# It can enrol any tag:worker node: give that client the worker tag and no more.
# Mounted read-only, mode 0400, in this pod only. Leave it empty until you turn
# -provision-create on.
apiVersion: v1
kind: Secret
metadata:
  name: comebye-provisioner-tailscale-oauth
  namespace: comebye-hub   # CHANGE-ME
type: Opaque
