# The pod's identity. Unlike the hub's service account, its token IS mounted
# (the deployment sets automountServiceAccountToken: true): kubectl and virtctl
# fall back to it when there is no kubeconfig. It is bound to one Role in one
# other namespace (rbac.yaml) and to nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: comebye-provisioner
  namespace: comebye-hub   # CHANGE-ME: the hub's namespace
---
# tailscaled keeps its node identity in a Secret (TS_KUBE_SECRET), as the hub's
# sidecar does: read and write that one Secret, nothing else. Same-namespace
# Role, not the VM namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: comebye-provisioner-tailscale-state
  namespace: comebye-hub   # CHANGE-ME
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["comebye-provisioner-tailscale-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: comebye-provisioner-tailscale-state
  namespace: comebye-hub   # CHANGE-ME
subjects:
  - kind: ServiceAccount
    name: comebye-provisioner
    namespace: comebye-hub   # CHANGE-ME
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: comebye-provisioner-tailscale-state
