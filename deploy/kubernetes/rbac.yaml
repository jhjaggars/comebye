# tailscaled keeps its node identity in a Secret (TS_KUBE_SECRET), so the
# pod's service account may read and write that one Secret, nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: comebye
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: comebye-tailscale-state
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["comebye-tailscale-state"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: comebye-tailscale-state
subjects:
  - kind: ServiceAccount
    name: comebye
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: comebye-tailscale-state
