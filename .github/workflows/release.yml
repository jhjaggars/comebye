name: Release

# Push a tag like v0.1.0 to build binaries and publish a GitHub release:
#   git tag -a v0.1.0 -m v0.1.0 && git push origin v0.1.0
# This workflow checks the exact commit it releases, and any failing step stops the release: govulncheck, the
# four-target build, and, when there is no green push CI run on the commit (tools/ci/releasegate.sh), go vet and
# go test -race. The nightly is not consulted. There is no override: fix the cause and re-run (the workflow can be
# run by hand from the Actions tab with the tag).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release (it must already exist)"
        required: true
        type: string

permissions:
  contents: read

# One Go version, the one on go.mod's toolchain line (the lint job checks they agree). setup-go v7 installs the `go` line's
# 1.26.0 when given go.mod, and Go then downloads the toolchain into the module cache, where the cache restore hits
# "Cannot open: File exists" on it. Installing the right one and never switching (GOTOOLCHAIN=local) avoids both.
env:
  GO_VERSION: "1.26.11"
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      actions: read   # read the CI runs for the gate
    env:
      VERSION: ${{ inputs.tag || github.ref_name }}
    steps:
      # Third-party actions are pinned by commit; the comment names the
      # release it was resolved from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # go.mod's toolchain line picks the exact Go release.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: gate
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/releasegate.sh "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Only when CI has not already tested this commit.
      - name: go vet
        if: steps.gate.outputs.tested != 'true'
        run: go vet ./...

      - name: go test
        if: steps.gate.outputs.tested != 'true'
        run: go test -race ./...

      # The newest advisory database, as the nightly uses; a finding fails the release.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      # Static, reproducible-ish binaries: no cgo, no local paths, the tag
      # stamped in as the version (comebye -version). Archive names carry
      # no version, so releases/latest/download/<name> is a stable URL.
      - name: build
        run: tools/ci/crossbuild.sh "$VERSION" dist

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$VERSION" \
            --generate-notes \
            --verify-tag
