name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Three independent jobs, so the slow ones run side by side. The workflow's
# conclusion (what `gh run list --commit` reports) is success only when all
# of them pass.
jobs:
  # gofmt, vet, build, vulnerabilities and JS syntax: fast.
  lint:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit; the comment names the
      # release it was resolved from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # go.mod's toolchain line picks the exact Go release; setup-go caches
      # the module and build caches keyed on go.sum.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Known vulnerabilities in the toolchain's standard library or in
      # dependencies that the code actually reaches. Installed rather than
      # run with `go run`, which may switch to a newer toolchain to build
      # it and would then scan that toolchain's standard library.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: node --check
        run: |
          for f in web/*.js; do node --check "$f"; done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # go.mod's toolchain line picks the exact Go release; setup-go caches
      # the module and build caches keyed on go.sum.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: go test
        run: go test -race ./...

  # The app in headless Chrome against a fake herdr (tools/uitest), one
  # prefers-color-scheme per job. Dev/CI only: its playwright-core is pinned
  # by package-lock.json and drives the runner's own Chrome, so nothing is
  # downloaded or shipped. Each job has its own runner, so run.sh's default
  # ports cannot clash.
  browser:
    name: browser (${{ matrix.scheme }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [dark, light]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # go.mod's toolchain line picks the exact Go release; setup-go caches
      # the module and build caches keyed on go.sum.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/uitest/package-lock.json

      - name: browser checks (${{ matrix.scheme }})
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "::warning::no google-chrome or chromium on this runner; skipping browser checks"
            exit 0
          fi
          CHROME="$CHROME" tools/uitest/run.sh . "$RUNNER_TEMP/uitest"

      # Screenshots and the console, network and server logs of the failed pass.
      - name: upload browser logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uitest-${{ matrix.scheme }}
          path: ${{ runner.temp }}/uitest
          if-no-files-found: ignore
