name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned by commit; the comment names the
      # release it was resolved from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # go.mod's toolchain line picks the exact Go release.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race ./...

      # Known vulnerabilities in the toolchain's standard library or in
      # dependencies that the code actually reaches. Installed rather than
      # run with `go run`, which may switch to a newer toolchain to build
      # it and would then scan that toolchain's standard library.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: node --check
        run: |
          for f in web/*.js; do node --check "$f"; done

      # The app in headless Chrome against a fake herdr (tools/uitest).
      # Dev/CI only: its playwright-core is pinned by package-lock.json and
      # drives the runner's own Chrome, so nothing is downloaded or shipped.
      - name: browser checks
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            echo "::warning::no google-chrome or chromium on this runner; skipping browser checks"
            exit 0
          fi
          CHROME="$CHROME" tools/uitest/run.sh . "$RUNNER_TEMP/uitest"
