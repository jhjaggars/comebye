name: CI

# Three tiers (docs/test-tiers.md). A pull request is the quick pre-submit tier: lint, the Go packages the
# change touches, and a browser smoke set. A push to main is the merge tier: everything once, in short parallel
# jobs. tools/ci/select.sh decides from the changed paths what each
# tier needs; a path it does not know means everything.
#
# Every run ends in ci-status, which is green when every job that was needed passed. Read that one
# (gh run list --commit reports the workflow's conclusion, which follows it).

on:
  push:
    branches: [main]
  pull_request:
  # The merge tier on any branch, by hand (gh workflow run CI --ref BRANCH): everything, as a push to main runs it. For
  # timing a CI change before it lands.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request supersedes the older one. Never on main: every landed commit gets its run, and so does
# every run by hand.
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# One Go version, the one on go.mod's toolchain line (the lint job checks they agree). setup-go v7 installs the `go` line's
# 1.26.0 when given go.mod, and Go then downloads the toolchain into the module cache, where the cache restore hits
# "Cannot open: File exists" on it. Installing the right one and never switching (GOTOOLCHAIN=local) avoids both.
env:
  GO_VERSION: "1.26.11"
  GOTOOLCHAIN: local

jobs:
  # Which checks does this change need? (tools/ci/select.sh; the table is in docs/test-tiers.md)
  changes:
    runs-on: ubuntu-latest
    outputs:
      lint: ${{ steps.sel.outputs.lint }}
      go: ${{ steps.sel.outputs.go }}
      scripts: ${{ steps.sel.outputs.scripts }}
      smoke: ${{ steps.sel.outputs.smoke }}
      visual: ${{ steps.sel.outputs.visual }}
      merge_go: ${{ steps.sel.outputs.merge_go }}
      merge_browser: ${{ steps.sel.outputs.merge_browser }}
      go_shards: ${{ steps.sel.outputs.go_shards }}
      browser_parallel: ${{ steps.sel.outputs.browser_parallel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # No Go cache here: this job builds nothing, and as the first job to finish it used to save an empty cache
      # (7 KB) under the key every other job restores, so each of them downloaded and built from scratch.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/ci/go-cache-epoch
          cache: false

      - id: sel
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or a forced push has no usable "before": test everything.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo ".github/workflows/ci.yml" | tools/ci/select.sh >> "$GITHUB_OUTPUT"
          else
            tools/ci/select.sh --base "$BASE" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  # gofmt, vet, build, vulnerabilities, JS syntax, static checks and contrast: fast.
  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/ci/go-cache-epoch

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: go.mod toolchain matches GO_VERSION
        run: test "$(awk '/^toolchain/{print $2}' go.mod)" = "go$GO_VERSION"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # Known vulnerabilities in the toolchain's standard library or in dependencies the code reaches. Installed
      # rather than run with `go run`, which may switch to a newer toolchain to build it.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: node --check
        run: |
          for f in web/*.js; do node --check "$f"; done

      # Static facts about web/ (no browser, under a second): every var(--x) is defined; the stacking tokens are in order.
      - name: static checks
        run: node tools/ci/static.mjs

      # Every theme in web/themes.js: WCAG AA contrast, and every token the page uses is defined.
      - name: theme contrast
        run: node tools/uitest/contrast.mjs

      # tools/ci/remote.sh against a fake ssh and a local folder for the VM (about 10 s, no network).
      - name: remote.sh self-test
        run: tools/ci/remote_test.sh

      # tools/ci/select.sh's answers, and every browser script in exactly one part (a few seconds).
      - name: select.sh self-test
        run: tools/ci/select_test.sh


  # Merge tier: every Go test in 3 parts: internal/server's tests in 2 halves, every other package beside them
  # (tools/ci/gotest.sh).
  go-full:
    name: go test (${{ matrix.shard }}/3)
    needs: changes
    if: github.event_name != 'pull_request' && needs.changes.outputs.merge_go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Their own Go cache, with the -race builds in it: the shared one is saved by a job that builds without -race, so
      # each test job used to compile the race-instrumented standard library and dependencies from scratch. Two kinds,
      # one key a day each: "server" (internal/server's tests, parts 1 and 2) and "others" (part 3, or a single
      # go-changed job). Pushes to main save them (part 1 and part 3); a pull request reads main's. Test results are
      # never cached (-shuffle is not a cacheable flag), so every test still runs.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - id: day
        env:
          KIND: ${{ matrix.shard == '3' && 'others' || 'server' }}
        run: |
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - id: racecache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ steps.day.outputs.kind }}-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go-cache-epoch') }}-${{ steps.day.outputs.day }}
          restore-keys: go-race-${{ steps.day.outputs.kind }}-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go-cache-epoch') }}-

      - name: go test -race
        run: tools/ci/gotest.sh --shard ${{ matrix.shard }}/3

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && github.event_name != 'pull_request' && matrix.shard != '2' && steps.racecache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ steps.day.outputs.kind }}-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go-cache-epoch') }}-${{ steps.day.outputs.day }}

  # Pre-submit tier: only the packages the change touches and the packages that import them. When internal/server is
  # one of them (it takes most of the time), in 3 jobs split the way go-full splits it (select.sh's go_shards).
  go-changed:
    name: go-changed (${{ matrix.shard }}/${{ needs.changes.outputs.go_shards }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.go != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.go_shards == '3' && '["1", "2", "3"]' || '["1"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Their own Go cache, with the -race builds in it: the shared one is saved by a job that builds without -race, so
      # each test job used to compile the race-instrumented standard library and dependencies from scratch. Two kinds,
      # one key a day each: "server" (internal/server's tests, parts 1 and 2) and "others" (part 3, or a single
      # go-changed job). Pushes to main save them (part 1 and part 3); a pull request reads main's. Test results are
      # never cached (-shuffle is not a cacheable flag), so every test still runs.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - id: day
        env:
          KIND: ${{ (matrix.shard == '3' || needs.changes.outputs.go_shards == '1') && 'others' || 'server' }}
        run: |
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

      - id: racecache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-${{ steps.day.outputs.kind }}-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go-cache-epoch') }}-${{ steps.day.outputs.day }}
          restore-keys: go-race-${{ steps.day.outputs.kind }}-${{ runner.os }}-${{ hashFiles('go.sum', 'tools/ci/go-cache-epoch') }}-

      - name: go test -race
        env:
          PKGS: ${{ needs.changes.outputs.go }}
          SHARDS: ${{ needs.changes.outputs.go_shards }}
          SHARD: ${{ matrix.shard }}
        run: |
          if [ "$SHARDS" = 3 ]; then
            if [ "$PKGS" = all ]; then tools/ci/gotest.sh --shard "$SHARD/3"; else tools/ci/gotest.sh --shard "$SHARD/3" $PKGS; fi
          elif [ "$PKGS" = all ]; then tools/ci/gotest.sh; else tools/ci/gotest.sh $PKGS; fi

  # The app in headless Chrome against a fake herdr (tools/uitest). Dev/CI only: its playwright-core is pinned by
  # package-lock.json and drives the runner's own Chrome, so nothing is downloaded or shipped.
  # Pre-submit: the smoke set (about 160 checks covering every screen, 2 minutes), plus the scripts for the paths the change touches.
  # A change that needs every script (scripts=all: CI, the driver, go.mod), or whose smoke set plus extra scripts is
  # estimated over 5 minutes (select.sh's browser_parallel), runs the merge tier's parallel jobs below instead.
  browser-smoke:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.browser_parallel != 'true' && (needs.changes.outputs.smoke == 'true' || needs.changes.outputs.scripts != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/ci/go-cache-epoch

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/uitest/package-lock.json

      - name: browser smoke checks
        env:
          SCRIPTS: ${{ needs.changes.outputs.scripts }}
        run: EXTRA="$SCRIPTS" tools/ci/browser.sh smoke dark "$RUNNER_TEMP/uitest"
      - name: upload browser logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uitest-smoke
          path: ${{ runner.temp }}/uitest
          if-no-files-found: ignore

  # Merge tier, behaviour, dark only: drive.mjs (the main app) beside every other script. Also on a pull request whose
  # browser checks would take one smoke job over 5 minutes (browser_parallel), in its place: every script, in parallel.
  browser-drive:
    needs: changes
    if: (github.event_name != 'pull_request' && needs.changes.outputs.merge_browser == 'true') || (github.event_name == 'pull_request' && needs.changes.outputs.browser_parallel == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/ci/go-cache-epoch

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/uitest/package-lock.json

      - name: browser checks (drive)
        run: tools/ci/browser.sh drive dark "$RUNNER_TEMP/uitest"
      - name: upload browser logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uitest-drive
          path: ${{ runner.temp }}/uitest
          if-no-files-found: ignore

  # Every other behaviour script, in 7 parallel parts balanced by each script's time (tools/ci/browser-times.txt;
  # `tools/ci/browser.sh parts rest 7` prints them). 7, not 6: each part then takes about as long as browser-drive,
  # the one job that cannot be split, so neither waits on the other.
  browser-rest:
    name: browser rest (${{ matrix.shard }}/7)
    needs: changes
    if: (github.event_name != 'pull_request' && needs.changes.outputs.merge_browser == 'true') || (github.event_name == 'pull_request' && needs.changes.outputs.browser_parallel == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4", "5", "6", "7"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/ci/go-cache-epoch

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/uitest/package-lock.json

      - name: browser checks (the other scripts, part ${{ matrix.shard }} of 7)
        run: tools/ci/browser.sh rest dark "$RUNNER_TEMP/uitest" ${{ matrix.shard }}/7
      - name: upload browser logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uitest-rest-${{ matrix.shard }}
          path: ${{ runner.temp }}/uitest
          if-no-files-found: ignore

  # The visual pass in both colour schemes: the design-language scripts (focus ring, chips, controls, fonts,
  # decision-set card, page starters). Behaviour is checked once, above; colour is checked twice, here. Each scheme in 2
  # parts balanced by time (landscape alone is about 2 minutes).
  visual:
    name: visual (${{ matrix.scheme }} ${{ matrix.part }}/2)
    needs: changes
    if: (github.event_name != 'pull_request' && needs.changes.outputs.merge_browser == 'true') || (github.event_name == 'pull_request' && needs.changes.outputs.visual == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [dark, light]
        part: ["1", "2"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/ci/go-cache-epoch

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/uitest/package-lock.json

      - name: visual checks (${{ matrix.scheme }}, part ${{ matrix.part }} of 2)
        run: tools/ci/browser.sh visual ${{ matrix.scheme }} "$RUNNER_TEMP/uitest" ${{ matrix.part }}/2
      - name: upload browser logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uitest-visual-${{ matrix.scheme }}-${{ matrix.part }}
          path: ${{ runner.temp }}/uitest
          if-no-files-found: ignore

  # The day in the life (tools/smoke): one end-to-end run of what the user and agents actually do, on a throwaway hub with a
  # stand-in herdr and a bare origin: handoff, report, a to-do answered on the phone, landing, a Page and its chat, park,
  # resume, restart, GPG unlock, and the coordinator's board, log and digest. Every hardening slice keeps it green: a red
  # run here means normal use broke. Pre-submit whenever the smoke set runs; merge whenever the browser checks do.
  day-in-the-life:
    needs: changes
    if: (github.event_name == 'pull_request' && needs.changes.outputs.smoke == 'true') || (github.event_name != 'pull_request' && needs.changes.outputs.merge_browser == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            go.sum
            tools/ci/go-cache-epoch

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/uitest/package-lock.json

      - name: the smoke's cleanup never touches a real gpg-agent
        run: tools/smoke/cleanup_test.sh
      - name: day in the life
        env:
          SMOKE_REQUIRE_GPG: "1"
        run: tools/smoke/run.sh "$RUNNER_TEMP/smoke"
      - name: upload smoke logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: day-in-the-life
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore

  # One job to read. Green when every job this change needed passed; a skipped job is one it did not need.
  ci-status:
    if: always()
    needs: [changes, lint, go-full, go-changed, browser-smoke, browser-drive, browser-rest, visual, day-in-the-life]
    runs-on: ubuntu-latest
    steps:
      - name: every needed job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
